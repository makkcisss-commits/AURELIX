services:
  aurelix:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      AURELIX_ENV: production
      AURELIX_LOG_LEVEL: ${AURELIX_LOG_LEVEL:-INFO}
      AURELIX_HOST: 0.0.0.0
      AURELIX_PORT: 8000
      AURELIX_OWNER_ID: ${AURELIX_OWNER_ID:?set AURELIX_OWNER_ID}
      AURELIX_OWNER_SECRET: ${AURELIX_OWNER_SECRET:?set AURELIX_OWNER_SECRET}
      AURELIX_MODEL_BASE_URL: ${AURELIX_MODEL_BASE_URL:?set AURELIX_MODEL_BASE_URL}
      AURELIX_MODEL_NAME: ${AURELIX_MODEL_NAME:-gpt-4o-mini}
      AURELIX_MODEL_API_KEY: ${AURELIX_MODEL_API_KEY:?set AURELIX_MODEL_API_KEY}
      AURELIX_RESEARCH_PROVIDER: tavily
      AURELIX_RESEARCH_API_KEY: ${AURELIX_RESEARCH_API_KEY:?set AURELIX_RESEARCH_API_KEY}
      AURELIX_AUTONOMY_ENABLED: ${AURELIX_AUTONOMY_ENABLED:-true}
      AURELIX_AUTONOMY_INTERVAL_SECONDS: ${AURELIX_AUTONOMY_INTERVAL_SECONDS:-900}
      AURELIX_AUTONOMY_OBJECTIVE: ${AURELIX_AUTONOMY_OBJECTIVE:-Continuously inspect AURELIX, research useful opportunities, validate learning, and prepare governed next actions.}
    volumes:
      # RuntimeStore is currently SQLite-backed. Keep the durable database on a
      # named volume so container recreation does not silently erase state.
      - runtime_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      AURELIX_DOMAIN: ${AURELIX_DOMAIN:?set AURELIX_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      aurelix:
        condition: service_healthy
    restart: unless-stopped

volumes:
  runtime_data:
  caddy_data:
  caddy_config:
