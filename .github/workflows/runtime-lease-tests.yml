name: Runtime Lease Tests

on:
  push:
    branches:
      - agent/production-deployment
  pull_request:
    branches:
      - agent/production-deployment
  workflow_dispatch:

jobs:
  lease-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run runtime lease tests
        run: python -m pytest -q tests/test_runtime_leases.py
