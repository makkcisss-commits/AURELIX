name: AURELIX Real Provider Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-provider-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run real provider smoke test
        env:
          AURELIX_RESEARCH_PROVIDER: tavily
          AURELIX_RESEARCH_API_KEY: ${{ secrets.AURELIX_RESEARCH_API_KEY }}
          AURELIX_MODEL_BASE_URL: ${{ secrets.AURELIX_MODEL_BASE_URL }}
          AURELIX_MODEL_API_KEY: ${{ secrets.AURELIX_MODEL_API_KEY }}
          AURELIX_MODEL_NAME: ${{ secrets.AURELIX_MODEL_NAME }}
        run: python scripts/smoke_real_providers.py
