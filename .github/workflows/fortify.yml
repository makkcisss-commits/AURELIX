name: Fortify AST Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "42 9 * * 1"
  workflow_dispatch:

env:
  FOD_URL: https://ams.fortify.com

jobs:
  Fortify-AST-Scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check Out Source Code
        uses: actions/checkout@v4

      - name: Validate Fortify configuration
        id: config
        env:
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PAT: ${{ secrets.FOD_PAT }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          client_ready=false
          user_ready=false
          if [[ -n "${FOD_CLIENT_ID:-}" && -n "${FOD_CLIENT_SECRET:-}" ]]; then
            client_ready=true
          fi
          if [[ -n "${FOD_TENANT:-}" && -n "${FOD_USER:-}" && -n "${FOD_PAT:-}" ]]; then
            user_ready=true
          fi
          if [[ "${client_ready}" == true && "${user_ready}" == true ]]; then
            echo "Fortify configuration is ambiguous: configure exactly one authentication mode." >&2
            exit 1
          fi
          if [[ "${client_ready}" == true ]]; then
            echo "mode=client" >> "$GITHUB_OUTPUT"
            echo "Fortify configuration: client credentials present."
            exit 0
          fi
          if [[ "${user_ready}" == true ]]; then
            echo "mode=user" >> "$GITHUB_OUTPUT"
            echo "Fortify configuration: user credentials present."
            exit 0
          fi
          echo "BLOCKED_EXTERNAL_DEPENDENCY: Fortify credentials are not configured." >&2
          echo "Configure exactly one of: FOD_CLIENT_ID/FOD_CLIENT_SECRET or FOD_TENANT/FOD_USER/FOD_PAT." >&2
          exit 1

      - name: Run Fortify Scan with client credentials
        if: steps.config.outputs.mode == 'client'
        uses: fortify/github-action@ef5539bf4bd9c45c0bd971978f635a69eae55297
        with:
          sast-scan: true
          debricked-sca-scan: true
        env:
          FOD_URL: ${{ env.FOD_URL }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}

      - name: Run Fortify Scan with user credentials
        if: steps.config.outputs.mode == 'user'
        uses: fortify/github-action@ef5539bf4bd9c45c0bd971978f635a69eae55297
        with:
          sast-scan: true
          debricked-sca-scan: true
        env:
          FOD_URL: ${{ env.FOD_URL }}
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
