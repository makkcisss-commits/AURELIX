name: AURELIX CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install -e .
      - name: Validate Python syntax
        run: python -m compileall -q src tests
      - name: Run tests
        run: pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurelix
          POSTGRES_PASSWORD: aurelix
          POSTGRES_DB: aurelix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aurelix -d aurelix"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AURELIX_DATABASE_URL: postgresql://aurelix:aurelix@127.0.0.1:5432/aurelix
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install -e .
      - name: Validate Python syntax
        run: python -m compileall -q src tests
      - name: Run PostgreSQL integration test
        run: pytest -q tests/test_postgres_knowledge_repository.py

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build container
        run: docker build --tag aurelix:ci .
      - name: Start container
        run: |
          docker run --detach --rm \
            --name aurelix-ci \
            -e AURELIX_OWNER_SECRET=ci-smoke-secret \
            -p 18000:8000 \
            aurelix:ci
      - name: Wait for readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs aurelix-ci
              exit 1
            fi
            sleep 1
          done
      - name: Verify protected readiness
        run: |
          curl --fail --silent \
            -H 'X-AURELIX-SECRET: ci-smoke-secret' \
            http://127.0.0.1:18000/ready
      - name: Verify authenticated control snapshot
        run: |
          curl --fail --silent \
            -H 'X-AURELIX-SECRET: ci-smoke-secret' \
            http://127.0.0.1:18000/v1/control/snapshot > /tmp/snapshot.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/snapshot.json'))
          assert 'runtime' in payload
          assert 'providers' in payload
          assert 'experiments' in payload
          assert 'knowledge' in payload
          assert 'audit_events' in payload
          print(json.dumps(payload, indent=2))
          PY
      - name: Verify unauthenticated control plane is rejected
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/v1/control/snapshot)" = "401"
      - name: Stop container
        if: always()
        run: docker stop aurelix-ci || true

  production-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate production Compose
        env:
          AURELIX_DOMAIN: example.test
          AURELIX_OWNER_ID: ci-owner
          AURELIX_OWNER_SECRET: ci-owner-secret
          POSTGRES_PASSWORD: ci-postgres-password
          AURELIX_MODEL_BASE_URL: https://api.openai.com/v1
          AURELIX_MODEL_API_KEY: ci-model-key
          AURELIX_RESEARCH_API_KEY: ci-research-key
        run: docker compose -f deploy/production/docker-compose.yml config --quiet
      - name: Validate Caddy configuration
        env:
          AURELIX_DOMAIN: example.test
        run: |
          docker run --rm \
            -e AURELIX_DOMAIN \
            -v "$PWD/deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate browser JavaScript syntax
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
