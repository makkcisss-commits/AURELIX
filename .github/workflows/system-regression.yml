name: AURELIX System Regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  system-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run system regression suite
        run: >-
          python -m pytest -q
          tests/test_engine_factory_composition.py
          tests/test_integrated_intelligence_flow.py
          tests/test_intelligence_flow.py
          tests/test_system_diagnostics_and_developer.py
          tests/test_opportunity_revenue_bridge.py
          tests/test_approval_workflow.py
          tests/test_innovation.py

      - name: Run smoke checks
        run: python -m pytest -q tests/test_smoke.py
