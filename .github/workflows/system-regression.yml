name: AURELIX System Regression

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: system-regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  system-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest

      - name: Run system regression suite
        run: >-
          python -m pytest -q
          tests/test_engine_factory_composition.py
          tests/test_integrated_intelligence_flow.py
          tests/test_intelligence_flow.py
          tests/test_system_diagnostics_and_developer.py
          tests/test_opportunity_revenue_bridge.py
          tests/test_approval_workflow.py
          tests/test_innovation.py

      - name: Run packaged smoke checks
        run: aurelix-smoke
