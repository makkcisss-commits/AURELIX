[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelix-core"
version = "0.1.0"
description = "Governance-first core for the AURELIX private venture intelligence system."
requires-python = ">=3.11"

[project.scripts]
aurelix-server = "aurelix_core.server:main"
aurelix-smoke = "aurelix_core.smoke:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
